name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: בדיקות ובנייה
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: המתאם — analyze
        working-directory: companion
        run: |
          dart pub get
          dart analyze

      - name: המתאם — בדיקות
        working-directory: companion
        run: dart test

      - name: המתאם — קימפול
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Location companion
          dart compile exe bin/chavruta_companion.dart -o ../dist/ChavrutaCompanion.exe

      # המשגר הוא מה שנרשם לעלייה עם המחשב, כדי שלא ייווצר חלון קונסולה.
      # -Required כדי ששבירה של launcher/chavruta_launcher.c תיפול כאן ולא
      # תתגלה רק בשחרור.
      - name: המשגר — קימפול
        shell: pwsh
        run: ./launcher/build.ps1 -Output dist -Required

      # אריזה בלי אוצריא: ולידציה קלה בלבד. הוולידציה המלאה (הרשאות מול
      # קריאות API, תאימות DESIGN_GUIDE) רצה בפיתוח מקומי דרך
      # `otzaria pack-plugin`, כי היא חיה בתוך אוצריא עצמה.
      - name: התוסף — אריזה
        shell: pwsh
        run: ./tool/pack-plugin.ps1 -Output dist

      # כך אפשר להוריד גרסה לבדיקה מכל commit, בלי לתייג שחרור.
      - name: העלאת תוצרים
        uses: actions/upload-artifact@v4
        with:
          name: chavruta-dev-build
          path: |
            dist/ChavrutaCompanion.exe
            dist/ChavrutaLauncher.exe
            dist/*.otzplugin
          if-no-files-found: error
