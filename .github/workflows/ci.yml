name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  companion:
    name: מתאם — analyze + test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart compile exe bin/chavruta_companion.dart -o ChavrutaCompanion.exe
